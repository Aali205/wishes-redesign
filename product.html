<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتج | Wishes</title>
  <meta name="description" content="تفاصيل المنتج من Wishes." />
  <meta name="theme-color" content="#1F1430" />
  <link rel="icon" type="image/png" href="/images/wishes-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Aref Ruqaa: Ruqaa calligraphy for display (handwritten, like a wish note).
       Readex Pro: clean Arabic/Latin text face. Falls back to Windows Arabic faces offline. -->
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Motion is opt-in: only when JS runs and the visitor allows motion.
    // Safety net: if the app never signals "ready", show the hero anyway.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('js-motion');
      setTimeout(function () { document.documentElement.classList.add('is-ready'); }, 4500);
    }
  </script>
</head>
<body data-page="product" data-tone="petal">
<a class="skip-link" href="#main">تخطّي إلى المحتوى</a>

<!-- Icon sprite, injected before the markup below is parsed. -->
<script src="/sprite.js"></script>

<!-- Header, footer and floating button are rendered by src/layout.js -->
<header class="site-header" id="top"></header>

<main id="main" tabindex="-1">
  <!-- Product detail, filled by src/main.js from the ?id= in the URL -->
  <section class="section product-section">
    <div class="wrap" id="product-detail"></div>
  </section>

  <section class="section section-soft" aria-labelledby="related-title">
    <div class="wrap">
      <div class="section-head reveal">
        <p class="kicker">قد يعجبك أيضاً</p>
        <h2 class="display-2" id="related-title">منتجات أخرى</h2>
      </div>
      <div class="products" id="related-grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
